services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs"]
    environment:
      MYSQL_DATABASE: rota
      MYSQL_USER: rota_user
      MYSQL_PASSWORD: rota_pass
      MYSQL_ROOT_PASSWORD: rota_root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 es deliberado: durante la inicialización la imagen levanta un servidor
      # temporal sólo por socket; un ping por socket daría "healthy" antes de tiempo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u rota_user -prota_pass --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_TYPE: mysql
      DATABASE_URL: mysql://rota_user:rota_pass@db:3306/rota
      HOLIDAY_API_URL: https://date.nager.at/api/v3
      CITY: Alicante
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    environment:
      API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mysqldata:
