<header class="app-header">
  <span class="city-label">{{ city() }}</span>
  <span class="header-divider"></span>
  <span class="app-title">Cuadrante de Guardias</span>
  <span class="header-spacer"></span>
  <button class="btn-export" [disabled]="!hasData() || exporting()" (click)="onExportRota()">
    Exportar a Excel
  </button>
  <button class="btn-stats" (click)="toggleStats()">
    {{ showStats() ? 'Ocultar estadísticas' : 'Mostrar estadísticas' }}
  </button>
</header>

<div class="app-layout" cdkDropListGroup>
  <app-doctor-pool
    [doctors]="activePoolDoctors()"
    [activeTab]="activePoolTab()"
    [hasExistingRota]="hasExistingRota()"
    [isLoading]="loading()"
    [strategy]="selectedStrategy()"
    [generatedStrategy]="generatedStrategy()"
    (strategyChange)="selectedStrategy.set($event)"
    (poolTabChange)="onPoolTabChange($event)"
    (generateRota)="onGenerateRota()"
    (doctorAdded)="onAddDoctor($event)"
  />
  <div class="calendar-wrapper">
    @if (loading()) {
      <div class="loading-overlay">
        <div class="spinner"></div>
        @if (isGenerating()) {
          <span class="loading-text">Generando cuadrante...</span>
        } @else {
          <span class="loading-text">Cargando...</span>
        }
      </div>
    }
    <app-calendar
      [year]="selectedYear()"
      [schedule]="mergedSchedule()"
      [hasData]="hasData()"
      [manualHolidayDates]="manualHolidayDates()"
      [allHolidayDates]="allHolidayDates()"
      (yearChange)="onYearChange($event)"
      (monthChange)="onMonthChange($event)"
      (doctorDropped)="onDoctorDropped($event)"
      (dayContextMenu)="onDayContextMenu($event)"
    />
  </div>
  <app-stats-panel [visible]="showStats()" [stats]="activeStats()" [activeTab]="activePoolTab()" [currentMonth]="currentMonth()" (closed)="toggleStats()" />
  <app-notifications />
</div>

@if (showConfirmDialog()) {
  <app-confirm-dialog
    [message]="confirmMessage()"
    (confirmed)="onConfirmRegenerate()"
    (cancelled)="onCancelRegenerate()"
  />
}

@if (pendingReplacement()) {
  <app-replace-doctor-dialog
    [date]="pendingReplacement()!.date"
    [doctorName]="pendingReplacement()!.newDoctor.name"
    [doctors]="getReplaceableDoctors(activePoolTab(), pendingReplacement()!)"
    (added)="onAddDoctorToDay()"
    (selected)="onReplaceDoctorSelected($event)"
    (cancelled)="onCancelReplacement()"
  />
}

@if (contextMenuOpen()) {
  <app-day-context-menu
    [x]="contextMenuPosition().x"
    [y]="contextMenuPosition().y"
    [date]="contextMenuDate()"
    [dayType]="contextMenuDayType()"
    (actionSelected)="onContextMenuAction($event)"
    (dismissed)="onCloseContextMenu()"
  />
}
